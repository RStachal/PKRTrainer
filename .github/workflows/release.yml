name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Strict release gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete release check
        run: npm run release:check

      - name: Upload verified release build
        uses: actions/upload-artifact@v4
        with:
          name: pkrtrainer-${{ github.ref_name }}
          path: dist
          if-no-files-found: error
