name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  technical:
    name: Technical baseline (Node 22)
    runs-on: ubuntu-latest
    # Rozdeleno 2. 9. 2026 na zadost majitele: repozitar je privatni, takze se
    # minuty uctuji, a plna pipeline na kazdy push je nejdrazsi mozna varianta.
    #
    # Tady zustava rychla a informativni cast. Produkcni build a Chrome E2E se
    # presunuly do `release-gates`, ktery bezi az pri merge do main nebo na
    # vyzadani - lokalni `verify:block` je stejne pousti pred kazdym commitem.
    #
    # Do puvodnich petadvaceti minut se job vesel jen proto, ze **umiral na
    # testech** a devet dalsich kroku se nikdy nespustilo; jakmile testy prosly,
    # dobehl do stropu a GitHub ho oznacil jako "cancelled". Zruseny beh se
    # pritom uctuje cely, tedy petadvacet minut za nulovou informaci.
    #
    # Zmereno na prvnim zelenem behu 2. 9. 2026: cely rychly job **13 minut**
    # (12:20:46 -> 12:33:47), diagnosticky job 43 vterin. Petadvacet je tedy
    # skoro dvojnasobna rezerva; strop tu neni na to, aby byl tesny, ale aby
    # zastavil beh, ktery se zasekl.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Full tests
        # Halda a jeden worker, protože knihovna přerostla runner.
        #
        # CI padalo od 31. 8. 2026 na `FATAL ERROR: Reached heap limit` a exit
        # kódu 134 - a padalo tiše, protože se na červený CI nikdo nedíval.
        # Runner má 4 jádra a 16 GB; dva workery s výchozí haldou se do toho
        # přestaly vejít, když líná knihovna narostla na 53 MB, kterou si testy
        # přes `resolveJsonModule` natahují.
        #
        # Jeden worker je pomalejší, ale CI není úzké hrdlo - úzké hrdlo je
        # noční solving a kontrola majitelem.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          PKRTRAINER_TEST_WORKERS: "1"
        run: |
          mkdir -p artifacts
          npm test -- --reporter=default --reporter=junit --outputFile=artifacts/vitest-junit.xml

      - name: Generated registry is current
        run: npm run mtt:refresh-registry -- --check

      - name: Registry integrity
        run: npm run mtt:registry-integrity

      - name: Raw intake workspace guard
        run: npm run range:intake:guard

      - name: Verify ranges
        run: npm run verify:ranges

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-node-22
          path: artifacts/vitest-junit.xml
          if-no-files-found: warn


  release-gates:
    name: Release gates (build, bundle, E2E)
    runs-on: ubuntu-latest
    # Nebezi na kazdy push, a je to rozhodnuti o penezich.
    #
    # Repozitar je privatni, takze se minuty uctuji: pri padesatiminutovem behu
    # vychazi volnych 2 000 minut mesicne na zhruba ctyricet pushu, a tolik jich
    # padne za par dni. Tyhle brany proto bezi az pri merge do main nebo na
    # vyzadani (`workflow_dispatch`). Nocni rozvrh schvalne neni: stal by kolem
    # 900 minut mesicne, tedy pulku kvoty, aniz by na nej cokoli cekalo.
    #
    # Nepokryte to nezustava: lokalni `verify:block` pousti tentyz retezec
    # vcetne E2E pred kazdym commitem. CI navic prinasi cisty checkout a Linux -
    # a prave to odhalilo petici testu, ktere tvrdily neco o vstupech mimo git.
    if: github.event_name != 'pull_request'
    needs: technical
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Precache integrity
        run: npm run verify:precache

      - name: Bundle budget
        run: npm run bundle:budget

      - name: Production Chrome E2E
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          npm run e2e:chrome
          npm run e2e:chrome:production-fixture

      - name: Upload Chrome E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtt-chrome-e2e-node-22
          path: artifacts/e2e-*
          if-no-files-found: warn

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist-node-22
          path: dist
          if-no-files-found: error

  mtt-data-status:
    name: MTT production data status (diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run production-data gates
        run: |
          mkdir -p artifacts
          npm run mtt:handoff

      - name: Upload MTT gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtt-production-data-status
          path: |
            artifacts/mtt-*-report.json
            artifacts/range-intake*-report.json
            artifacts/e2e-android-preflight/report.json
          if-no-files-found: warn
