name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  technical:
    name: Technical baseline (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Full tests
        run: |
          mkdir -p artifacts
          npm test -- --reporter=default --reporter=junit --outputFile=artifacts/vitest-junit.xml

      - name: Generated registry is current
        run: npm run mtt:refresh-registry -- --check

      - name: Registry integrity
        run: npm run mtt:registry-integrity

      - name: Raw intake workspace guard
        run: npm run range:intake:guard

      - name: Verify ranges
        run: npm run verify:ranges

      - name: Production build
        run: npm run build

      - name: Precache integrity
        run: npm run verify:precache

      - name: Bundle budget
        run: npm run bundle:budget

      - name: Production Chrome E2E
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          npm run e2e:chrome
          npm run e2e:chrome:production-fixture

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-node-22
          path: artifacts/vitest-junit.xml
          if-no-files-found: warn

      - name: Upload Chrome E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtt-chrome-e2e-node-22
          path: artifacts/e2e-*
          if-no-files-found: warn

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist-node-22
          path: dist
          if-no-files-found: error

  mtt-data-status:
    name: MTT production data status (diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run production-data gates
        run: |
          mkdir -p artifacts
          npm run mtt:slots -- --output=artifacts/mtt-slots-report.json
          npm run mtt:completion -- --output=artifacts/mtt-completion-report.json || true
          npm run mtt:intake-plan -- --output=artifacts/mtt-intake-plan-report.json
          npm run mtt:blockers -- --output=artifacts/mtt-blockers-report.json || true
          npm run mtt:next-action -- --output=artifacts/mtt-next-action-report.json
          npm run mtt:postflop-matrix -- --output=artifacts/mtt-postflop-matrix-report.json
          npm run mtt:postflop-positions -- --output=artifacts/mtt-postflop-positions-report.json
          npm run mtt:postflop-coverage -- --output=artifacts/mtt-postflop-coverage-report.json
          npm run mtt:postflop-release -- --output=artifacts/mtt-postflop-release-report.json || true
          npm run mtt:validate-ready-intake -- --output=artifacts/mtt-validate-ready-intake-report.json
          npm run mtt:promote-ready -- --output=artifacts/mtt-promote-ready-report.json
          npm run mtt:acceptance -- --output=artifacts/mtt-acceptance-report.json || true
          npm run mtt:release-gates -- --output=artifacts/mtt-release-gates-report.json || true

      - name: Upload MTT gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtt-production-data-status
          path: artifacts/mtt-*-report.json
          if-no-files-found: warn
