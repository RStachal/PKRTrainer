<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3d2e" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>MTT Preflop Trainer</title>
  </head>
  <body>
    <div id="app">
      <noscript>This app requires JavaScript to be enabled.</noscript>
    </div>
    <script>
      if (window.location.protocol === "file:") {
        document.getElementById("app").innerHTML =
          '<main style="max-width:720px;margin:64px auto;padding:24px;font:16px/1.5 system-ui,sans-serif;color:#17211d">' +
          "<h1>PKR Trainer potřebuje lokální webový server</h1>" +
          "<p>Aplikaci nelze spustit dvojklikem na <code>index.html</code>, protože prohlížeč blokuje JavaScript moduly načítané přes <code>file://</code>.</p>" +
          "<p>Spusťte soubor <strong>START_LOCAL.bat</strong> přiložený v balíčku. Pro webový deploy nahrajte obsah balíčku na HTTPS hosting.</p>" +
          "</main>";
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
